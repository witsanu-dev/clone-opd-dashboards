{#- ไอคอนแอปและ Favicon Title bar -#}
<link rel="manifest" href="{{ url_for('manifest') }}?v={{ icon_v }}">
<link rel="shortcut icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}?v={{ icon_v }}">
<link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}?v={{ icon_v }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='icon/favicon-32.png') }}?v={{ icon_v }}">
<link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='icon/icon-192.png') }}?v={{ icon_v }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='icon/apple-touch-icon.png') }}?v={{ icon_v }}">
<meta name="theme-color" content="#0f2a5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OPD Dashboard">

{#- Google Sans & Google Material Symbols and Icons -#}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Noto+Sans+Thai:wght@300;400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
<style>
.material-symbols-outlined {
  font-family: 'Material Symbols Outlined' !important;
  font-weight: normal;
  font-style: normal;
  font-size: 1.2em;
  line-height: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  vertical-align: -0.15em;
  letter-spacing: normal;
  text-transform: none;
  white-space: nowrap;
  word-wrap: normal;
  direction: ltr;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  -moz-osx-font-smoothing: grayscale;
  font-feature-settings: 'liga';
}
@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
.spinning {
  animation: spin 1.2s linear infinite;
  display: inline-flex;
}
</style>
